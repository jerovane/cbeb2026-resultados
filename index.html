:root{
  --azul:#005BC5; --azul-fundo:#073B78; --ceu:#00A0DC; --amarelo:#FFC805; --laranja:#FF6C00; --vermelho:#FF3F02; --agua:#2E9190;
  --fundo:#F7FAFF; --titulo:#132644; --realce:#005BC5; --tinta:#1F2A44; --suave:#566780;
  --vidro:rgba(255,255,255,.62); --vidro-borda:rgba(255,255,255,.9); --brilho:rgba(255,255,255,.95);
  --campo:rgba(255,255,255,.78); --campo-borda:#C9D7E8; --selo-fundo:rgba(0,91,197,.1); --selo-texto:#073B78;
  --erro:#B42318; --erro-fundo:rgba(217,66,66,.1);
  --sombra:0 40px 90px -24px rgba(7,59,120,.38),0 10px 28px -10px rgba(7,59,120,.2);
  --orbe:.55;
}
@media (prefers-color-scheme:dark){
  :root{
    --fundo:#07162D; --titulo:#F2F6FC; --realce:#6DB3FF; --tinta:#E6EDF8; --suave:#A3B4CC;
    --vidro:rgba(14,30,58,.58); --vidro-borda:rgba(255,255,255,.2); --brilho:rgba(255,255,255,.28);
    --campo:rgba(255,255,255,.08); --campo-borda:rgba(255,255,255,.22); --selo-fundo:rgba(109,179,255,.16); --selo-texto:#B5D6FF;
    --erro:#FF9C92; --erro-fundo:rgba(255,120,110,.14);
    --sombra:0 40px 90px -24px rgba(0,0,0,.7),0 10px 28px -10px rgba(0,0,0,.5);
    --orbe:.42;
  }
  /* a logo tem texto azul-escuro: no tema escuro ela ganha uma placa clara, sem ser recolorida */
  .marca{padding:11px 20px;border-radius:20px;background:rgba(255,255,255,.94);box-shadow:inset 0 1px 0 #fff,0 10px 26px -12px rgba(0,0,0,.6)}
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh;min-height:100dvh;background:var(--fundo);color:var(--tinta);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.faixa{position:fixed;inset:0 0 auto 0;height:6px;display:flex;z-index:5}
.faixa i{flex:1}
.faixa i:nth-child(1){background:var(--amarelo)}
.faixa i:nth-child(2){background:var(--vermelho)}
.faixa i:nth-child(3){background:var(--azul)}
.faixa i:nth-child(4){background:var(--agua)}

.ambiente{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.o{position:absolute;border-radius:50%;filter:blur(64px);opacity:var(--orbe);will-change:transform}
.o1{width:50vmax;height:50vmax;left:-16vmax;top:-20vmax;background:radial-gradient(circle at 30% 30%,var(--ceu),var(--azul) 72%);animation:flutua 24s ease-in-out infinite}
.o2{width:40vmax;height:40vmax;right:-14vmax;top:6vh;background:radial-gradient(circle,var(--amarelo),var(--laranja) 78%);animation:flutua 28s ease-in-out -6s infinite reverse}
.o3{width:36vmax;height:36vmax;left:10vw;bottom:-20vmax;background:radial-gradient(circle,var(--agua),var(--ceu) 82%);animation:flutua 26s ease-in-out -11s infinite}
.o4{width:24vmax;height:24vmax;right:20vw;bottom:-12vmax;background:radial-gradient(circle,var(--vermelho),var(--laranja) 70%);opacity:calc(var(--orbe) * .7);animation:flutua 30s ease-in-out -3s infinite reverse}
@keyframes flutua{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(3.5vmax,2.5vmax,0) scale(1.09)}}

.palco{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:grid;place-content:center;justify-items:center;gap:18px;padding:34px 16px}
.cartao{
  position:relative;width:min(100%,440px);padding:32px 28px 24px;border-radius:30px;text-align:center;overflow:hidden;
  background:var(--vidro);border:1px solid var(--vidro-borda);
  -webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);
  box-shadow:var(--sombra),inset 0 1px 0 var(--brilho);
  animation:entra .75s cubic-bezier(.2,.8,.2,1) both;
  transition:opacity .34s ease,transform .34s ease,filter .34s ease;
}
.cartao::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.34),rgba(255,255,255,0) 38%)}
.cartao>*{position:relative;z-index:1}
.cartao.some{opacity:0;transform:scale(.965) translateY(-8px);filter:blur(8px)}
@keyframes entra{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}

.marca{display:block;width:max-content;max-width:100%;margin:0 auto 18px;line-height:0}
.logo{display:block;width:172px;height:auto}
.selo{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;background:var(--selo-fundo);color:var(--selo-texto);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.selo svg{width:14px;height:14px}
h1{margin:16px 0 8px;font:800 clamp(25px,7.4vw,31px)/1.06 Poppins,system-ui,sans-serif;letter-spacing:-.005em;text-transform:uppercase;color:var(--titulo);text-wrap:balance}
h1 em{font-style:normal;color:var(--realce)}
.sub{margin:0 auto 22px;max-width:30ch;font-size:15px;line-height:1.45;color:var(--suave)}

form{text-align:left}
label{display:block;margin:0 2px 7px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
.campo{position:relative}
#senha{
  width:100%;height:56px;padding:0 56px 0 18px;border-radius:16px;border:1px solid var(--campo-borda);background:var(--campo);color:var(--tinta);
  font-family:inherit;font-size:17px;font-weight:600;line-height:1;letter-spacing:.03em;outline:none;transition:box-shadow .2s,border-color .2s,background .2s;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
#senha::placeholder{color:var(--suave);opacity:.7;font-weight:500;letter-spacing:.02em}
#senha:focus{border-color:var(--azul);box-shadow:0 0 0 4px rgba(0,91,197,.22)}
.olho{position:absolute;top:6px;right:6px;width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:12px;background:transparent;color:var(--suave);cursor:pointer;transition:background .2s,color .2s}
.olho:hover{background:rgba(0,91,197,.1);color:var(--azul)}
.olho:focus-visible{outline:3px solid var(--azul);outline-offset:-1px}
.olho svg{width:22px;height:22px}
.olho .fechado{display:none}
.olho[aria-pressed=true] .aberto{display:none}
.olho[aria-pressed=true] .fechado{display:block}

.aviso{min-height:21px;margin:9px 2px 11px;font-size:14px;font-weight:600;line-height:1.35;color:var(--suave)}
.aviso.erro{color:var(--erro)}
.erro-campo #senha{border-color:var(--erro);box-shadow:0 0 0 4px var(--erro-fundo);animation:treme .4s}
@keyframes treme{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.entrar{
  width:100%;height:56px;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:16px;cursor:pointer;
  background:linear-gradient(135deg,var(--amarelo),var(--laranja));color:#132644;
  font:800 15px/1 Poppins,system-ui,sans-serif;letter-spacing:.07em;text-transform:uppercase;
  box-shadow:0 14px 28px -12px rgba(255,108,0,.7),inset 0 1px 0 rgba(255,255,255,.55);
  transition:transform .18s,box-shadow .18s,filter .18s;
}
.entrar:hover{transform:translateY(-1px);filter:saturate(1.08);box-shadow:0 18px 32px -12px rgba(255,108,0,.78),inset 0 1px 0 rgba(255,255,255,.55)}
.entrar:active{transform:translateY(1px) scale(.992)}
.entrar:focus-visible{outline:3px solid var(--azul);outline-offset:3px}
.entrar[aria-busy=true]{cursor:progress;filter:saturate(.8)}
.giro{display:none;width:18px;height:18px;border-radius:50%;border:3px solid rgba(19,38,68,.25);border-top-color:#132644;animation:gira .8s linear infinite}
.entrar[aria-busy=true] .giro{display:block}
@keyframes gira{to{transform:rotate(360deg)}}

.nota{margin-top:18px;display:flex;align-items:flex-start;justify-content:center;gap:7px;font-size:12.5px;line-height:1.4;color:var(--suave);text-align:left}
.nota svg{flex:none;width:14px;height:14px;margin-top:1px}
.rodape{max-width:440px;text-align:center;font-size:12.5px;line-height:1.5;color:var(--suave)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
noscript{position:relative;z-index:2;display:block;margin:20px auto;max-width:440px;padding:14px 16px;border-radius:14px;background:#FFF1D6;color:#5C3B00;font-size:14px;text-align:center}

@media (max-width:380px){.cartao{padding:26px 20px 20px;border-radius:26px}.logo{width:150px}.marca{padding-left:16px;padding-right:16px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (prefers-reduced-transparency:reduce){
  .cartao{background:var(--fundo);-webkit-backdrop-filter:none;backdrop-filter:none}
}
</style>
</head>
<body>
<div class="faixa" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="ambiente" aria-hidden="true"><span class="o o1"></span><span class="o o2"></span><span class="o o3"></span><span class="o o4"></span></div>

<script>
(() => {
  'use strict';
  const COFRE = JSON.parse(document.getElementById('cofre').textContent);
  const AAD = new TextEncoder().encode('cbeb2026-painel-v' + COFRE.v);
  const CHAVE_SESSAO = 'cbeb2026-painel-chave';
  const $ = (id) => document.getElementById(id);
  const cartao = $('cartao'), form = $('form'), campo = $('campo'), senha = $('senha');
  const aviso = $('aviso'), entrar = $('entrar'), rotulo = $('rotulo'), olho = $('olho');

  const dePara64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const para64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); };
  const guardar = (k, v) => { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} };
  const ler = (k) => { try { return sessionStorage.getItem(k); } catch (e) { return null; } };

  function mensagem(texto, erro) {
    aviso.textContent = texto || '';
    aviso.classList.toggle('erro', !!erro);
    campo.classList.toggle('erro-campo', !!erro);
  }
  function ocupado(sim, texto) {
    entrar.setAttribute('aria-busy', sim ? 'true' : 'false');
    entrar.disabled = !!sim;
    senha.readOnly = !!sim;
    rotulo.textContent = sim ? (texto || 'Abrindo…') : 'Entrar';
  }

  async function derivar(texto) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(texto.normalize('NFKC')), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: dePara64(COFRE.s), iterations: COFRE.it }, base, 256);
    return new Uint8Array(bits);
  }
  async function decifrar(bits) {
    const chave = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
    const comprimido = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: dePara64(COFRE.i), additionalData: AAD }, chave, dePara64(COFRE.d));
    const fluxo = new Blob([comprimido]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(fluxo).text();
  }
  function abrirPainel(html) {
    const sai = () => { document.open(); document.write(html); document.close(); };
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return sai();
    cartao.classList.add('some');
    setTimeout(sai, 340);
  }

  const semSuporte = !(window.crypto && crypto.subtle && typeof DecompressionStream === 'function');
  if (semSuporte) {
    ocupado(false); entrar.disabled = true; senha.disabled = true;
    mensagem(window.crypto && crypto.subtle
      ? 'Este navegador é antigo demais. Use Chrome, Edge, Firefox ou Safari atualizados.'
      : 'Abra esta página por um endereço https:// (ou pelo Chrome) para a senha funcionar.', true);
    return;
  }

  olho.addEventListener('click', () => {
    const mostrar = senha.type === 'password';
    senha.type = mostrar ? 'text' : 'password';
    olho.setAttribute('aria-pressed', mostrar ? 'true' : 'false');
    olho.setAttribute('aria-label', mostrar ? 'Esconder a senha' : 'Mostrar a senha');
    senha.focus();
  });
  senha.addEventListener('input', () => { if (campo.classList.contains('erro-campo')) mensagem(''); });

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const texto = senha.value;
    if (!texto) { mensagem('Digite a senha para entrar.', true); senha.focus(); return; }
    mensagem(''); ocupado(true, 'Verificando…');
    try {
      const bits = await derivar(texto);
      const html = await decifrar(bits);
      guardar(CHAVE_SESSAO, para64(bits));
      ocupado(true, 'Abrindo…');
      abrirPainel(html);
    } catch (e) {
      ocupado(false);
      mensagem('Senha incorreta. Confira e tente de novo.', true);
      senha.select();
    }
  });

  // Mesma aba, recarregada: reabre sem pedir a senha de novo (a chave some ao fechar a aba).
  const guardada = ler(CHAVE_SESSAO);
  if (guardada) {
    ocupado(true, 'Abrindo…');
    mensagem('Abrindo o painel…');
    decifrar(dePara64(guardada)).then(abrirPainel).catch(() => {
      guardar(CHAVE_SESSAO, null); ocupado(false); mensagem(''); senha.focus();
    });
  }
})();
</script>
